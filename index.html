<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ComfyUI 知识库</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ComfyUI 学习笔记知识库">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    .sidebar-nav { padding-left: 10px; }
    .markdown-section { max-width: 900px; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .alert { padding: 8px 16px; border-radius: 4px; margin: 16px 0; }
    .alert-info { background: #e7f5ff; border-left: 4px solid #339af0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'ComfyUI 知识库',
      repo: '',
      loadSidebar: true,
      loadNavbar: false,
      coverpage: false,
      maxLevel: 3,
      subMaxLevel: 3,
      search: {
        placeholder: '搜索笔记...',
        noData: '没有找到结果',
        depth: 3,
        path: '/'
      },
      auto2top: true,
      homepage: 'README.md'
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/emoji.min.js"></script>
</body>
</html>
